<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲化生存記帳 v9 - 完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .quest-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .quest-card.completed { opacity: 0.5; filter: grayscale(1); transform: scale(0.95); }
        .progress-bar { transition: width 0.5s ease-out; }
        ::-webkit-scrollbar { display: none; }
        #questList { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 font-sans text-slate-900">

    <div class="max-w-md mx-auto p-4 space-y-6">

        <div class="bg-indigo-950 rounded-3xl p-5 shadow-2xl text-white">
            <div class="flex justify-between items-end mb-3">
                <div>
                    <h2 class="text-xs font-black text-yellow-400 uppercase tracking-widest text-[10px]">Monthly Quests</h2>
                    <p class="text-xl font-bold">本月生存挑戰</p>
                </div>
                <p id="questCount" class="text-xs font-mono text-yellow-400/70">0/0 完成</p>
            </div>
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden mb-6">
                <div id="questProgress" class="progress-bar bg-yellow-400 h-full w-0 shadow-[0_0_10px_rgba(250,204,21,0.5)]"></div>
            </div>
            <div id="questList" class="flex gap-3 overflow-x-auto pb-2 px-1 snap-x"></div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex justify-between items-center">
            <div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">可用餘額</p>
                <h1 id="mainBalance" class="text-3xl font-black text-slate-800">$ 0</h1>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">本月總預算</p>
                <input type="number" id="budgetLimit" class="w-24 font-bold text-right outline-none bg-slate-50 rounded p-1" onchange="saveBudget()" placeholder="0">
            </div>
        </div>

        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
            <h3 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-tighter">🏷️ 類別預算控管</h3>
            <div id="categoryGrid" class="grid grid-cols-2 gap-3 mb-4"></div>
            <div class="flex gap-2 p-2 bg-slate-50 rounded-xl border border-slate-200">
                <input type="text" id="newCatName" placeholder="新類別" class="flex-1 text-xs bg-transparent outline-none">
                <input type="number" id="newCatBudget" placeholder="預算" class="w-16 text-xs bg-transparent border-l pl-2 outline-none">
                <button onclick="addCategory()" class="bg-slate-800 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">新增</button>
            </div>
        </div>

        <details class="bg-slate-100 rounded-2xl p-4 cursor-pointer">
            <summary class="text-xs font-bold text-slate-500">⚙️ 任務、分期與資料備份設定</summary>
            <div class="mt-4 space-y-4">
                <div class="space-y-2 bg-purple-50 p-3 rounded-xl border border-purple-100">
                    <p class="text-[10px] font-bold text-purple-600">＋ 分期合約設定</p>
                    <div class="grid grid-cols-2 gap-2 text-[10px]">
                        <input type="text" id="insName" placeholder="項目名" class="p-2 border rounded">
                        <input type="number" id="insEach" placeholder="每期金額" class="p-2 border rounded">
                        <input type="date" id="insEnd" class="p-2 border rounded col-span-2">
                    </div>
                    <button onclick="addInstallment()" class="w-full bg-purple-600 text-white py-2 rounded-lg text-[10px] font-bold">儲存分期</button>
                </div>
                <div class="space-y-2 bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <p class="text-[10px] font-bold text-blue-600">＋ 固定任務設定</p>
                    <div class="grid grid-cols-2 gap-2 text-[10px]">
                        <input type="text" id="qName" placeholder="例如:電話費" class="p-2 border rounded">
                        <input type="number" id="qAmount" placeholder="金額(變動填0)" class="p-2 border rounded">
                        <input type="date" id="qDeadline" class="p-2 border rounded col-span-2">
                    </div>
                    <button onclick="addQuest()" class="w-full bg-blue-600 text-white py-2 rounded-lg text-[10px] font-bold">加入任務板</button>
                </div>
                
                <div class="mt-6 pt-4 border-t border-slate-200 space-y-2">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest text-center">Data Backup</p>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl text-[10px] font-bold shadow-lg">📤 匯出備份</button>
                        <button onclick="importData()" class="flex-1 bg-white text-slate-800 border border-slate-800 py-3 rounded-xl text-[10px] font-bold shadow-lg">📥 匯入還原</button>
                    </div>
                </div>
            </div>
        </details>

        <div class="bg-indigo-600 rounded-3xl p-6 shadow-xl text-white">
            <div class="flex gap-2 mb-4 bg-indigo-700/50 p-1 rounded-xl text-xs font-bold">
                <button onclick="setType('expense')" id="btnEx" class="flex-1 py-2 rounded-lg bg-white text-indigo-600 shadow">支出</button>
                <button onclick="setType('income')" id="btnIn" class="flex-1 py-2 rounded-lg">收入</button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <select id="activeCategory" class="bg-indigo-500 p-2 rounded-lg text-xs border-none outline-none"></select>
                    <select id="activePayment" class="bg-indigo-500 p-2 rounded-lg text-xs border-none outline-none">
                        <option>💵 現金</option><option>💳 信用卡</option><option>📱 Pi卡</option>
                    </select>
                </div>
                <input type="number" id="amount" placeholder="0" class="w-full bg-transparent text-5xl font-black text-center outline-none">
                <input type="text" id="itemName" placeholder="今天買了什麼？" class="w-full bg-indigo-500/50 p-3 rounded-xl text-sm outline-none placeholder:text-indigo-300">
                <button onclick="addItem()" class="w-full bg-white text-indigo-600 py-4 rounded-2xl font-black shadow-lg">確認送出</button>
            </div>
        </div>

        <div id="itemList" class="space-y-3"></div>
    </div>

    <div id="analysisModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50">
                <h3 id="modalTitle" class="font-bold">類別明細</h3>
                <button onclick="closeModal()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div id="analysisResult" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
            <div class="p-5 border-t bg-slate-50 text-right font-black text-xl text-indigo-600" id="analysisTotal"></div>
        </div>
    </div>

    <script>
        let currentType = 'expense';
        let state = JSON.parse(localStorage.getItem('accounting_v9')) || {
            records: [],
            categories: [{ name: '🍚 飲食', budget: 8000 }, { name: '🏠 固定支出', budget: 0 }],
            payments: ['💵 現金', '💳 信用卡', '📱 Pi卡'],
            quests: [], installments: [], budget: 0
        };

        function save() {
            localStorage.setItem('accounting_v9', JSON.stringify(state));
            render();
        }

        // --- 匯入匯出功能 ---
        function exportData() {
            const dataStr = JSON.stringify(state);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `money_backup_${new Date().toISOString().split('T')[0]}.txt`;
            link.click();
            alert("備份已下載，請妥善保存。");
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const reader = new FileReader();
                reader.readAsText(e.target.files[0], 'UTF-8');
                reader.onload = re => {
                    try {
                        const imported = JSON.parse(re.target.result);
                        if(confirm("匯入將覆蓋現有資料，確定嗎？")) {
                            state = imported;
                            save();
                            location.reload();
                        }
                    } catch(e) { alert("讀取失敗，檔案格式不正確。"); }
                }
            }
            input.click();
        }

        // --- 核心運作邏輯 ---
        function setType(t) {
            currentType = t;
            document.getElementById('btnEx').className = t==='expense' ? 'flex-1 py-2 rounded-lg bg-white text-indigo-600 shadow' : 'flex-1 py-2 rounded-lg';
            document.getElementById('btnIn').className = t==='income' ? 'flex-1 py-2 rounded-lg bg-white text-green-600 shadow' : 'flex-1 py-2 rounded-lg';
        }

        function addCategory() {
            const name = document.getElementById('newCatName').value;
            const budget = parseInt(document.getElementById('newCatBudget').value) || 0;
            if(name) { state.categories.push({ name, budget }); save(); }
            document.getElementById('newCatName').value = '';
            document.getElementById('newCatBudget').value = '';
        }

        function deleteCategory(name) {
            if(confirm(`刪除「${name}」？`)) { state.categories = state.categories.filter(c => c.name !== name); save(); }
        }

        function addQuest() {
            const name = document.getElementById('qName').value;
            const amount = parseInt(document.getElementById('qAmount').value) || 0;
            const deadline = document.getElementById('qDeadline').value;
            if(name) { state.quests.push({ id: 'q_' + Date.now(), name, amount, deadline }); save(); }
        }

        function addInstallment() {
            const name = document.getElementById('insName').value;
            const each = parseInt(document.getElementById('insEach').value);
            const end = document.getElementById('insEnd').value;
            if(name && each && end) { state.installments.push({ id: 'i_' + Date.now(), name, each, end }); save(); }
        }

        function toggleQuest(id) {
            const currentMonth = new Date().toISOString().slice(0, 7);
            const all = [...state.quests, ...state.installments.map(i => ({id: i.id, name: i.name, amount: i.each}))];
            const task = all.find(t => t.id === id);
            let final = task.amount || prompt(`請輸入「${task.name}」本月金額：`);
            if(final) {
                state.records.push({ amount: parseInt(final), itemName: task.name, category: '🏠 固定支出', payment: '💳 自動扣款', type: 'expense', date: new Date().toISOString().split('T')[0], id: Date.now(), taskId: id });
                save();
            }
        }

        function saveBudget() { state.budget = parseInt(document.getElementById('budgetLimit').value) || 0; save(); }

        function addItem() {
            const amount = parseInt(document.getElementById('amount').value);
            const itemName = document.getElementById('itemName').value;
            const category = document.getElementById('activeCategory').value;
            const payment = document.getElementById('activePayment').value;
            if(amount && itemName) {
                state.records.push({ amount, itemName, category, payment, type: currentType, date: new Date().toISOString().split('T')[0], id: Date.now() });
                document.getElementById('amount').value = '';
                document.getElementById('itemName').value = '';
                save();
            }
        }

        function openAnalysis(catName) {
            const currentMonth = new Date().toISOString().slice(0, 7);
            const filtered = state.records.filter(r => r.category === catName && r.date.startsWith(currentMonth));
            const total = filtered.reduce((sum, r) => sum + (r.type==='expense'?r.amount:-r.amount), 0);
            document.getElementById('modalTitle').innerText = catName;
            document.getElementById('analysisResult').innerHTML = filtered.reverse().map(r => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm">
                    <div><p class="font-bold">${r.itemName}</p><p class="text-[10px] text-slate-400">${r.date}</p></div>
                    <p class="font-bold text-indigo-600">$${r.amount}</p>
                </div>
            `).join('') || '<p class="text-center py-10 text-slate-400 text-xs">無紀錄</p>';
            document.getElementById('analysisTotal').innerText = `合計 $${total}`;
            document.getElementById('analysisModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('analysisModal').classList.add('hidden'); }

        function render() {
            const currentMonth = new Date().toISOString().slice(0, 7);
            const today = new Date();

            // 任務板渲染
            const activeQuests = [
                ...state.quests.map(q => ({...q, type: 'regular', displayEnd: q.deadline})),
                ...state.installments.filter(i => new Date(i.end) >= today).map(i => ({id: i.id, name: i.name, amount: i.each, type: 'ins', displayEnd: i.end}))
            ];
            const completedCount = activeQuests.filter(t => state.records.some(r => r.date.startsWith(currentMonth) && r.taskId === t.id)).length;
            document.getElementById('questProgress').style.width = (activeQuests.length ? (completedCount/activeQuests.length)*100 : 0) + '%';
            document.getElementById('questCount').innerText = `${completedCount}/${activeQuests.length}`;
            document.getElementById('questList').innerHTML = activeQuests.map(t => {
                const isDone = state.records.some(r => r.date.startsWith(currentMonth) && r.taskId === t.id);
                return `
                    <div onclick="toggleQuest('${t.id}')" class="snap-center quest-card ${isDone?'completed':''} bg-slate-800/80 min-w-[140px] p-4 rounded-2xl border-t border-slate-700 shadow-xl cursor-pointer">
                        <p class="text-[8px] font-black ${t.type==='ins'?'text-purple-400':'text-cyan-400'} uppercase mb-1 tracking-tighter">${t.type==='ins'?'Installment':'Quest'}</p>
                        <p class="text-[13px] font-bold truncate text-white mb-1">${t.name}</p>
                        <p class="text-base font-black text-yellow-400">$${t.amount || '待確認'}</p>
                        <div class="mt-2 pt-2 border-t border-slate-700/50 flex items-center justify-between">
                             <span class="text-[9px] text-slate-400 font-bold">截止日</span>
                             <span class="text-[9px] text-slate-300 font-mono">${t.displayEnd ? t.displayEnd.split('-').slice(1).join('/') : '--'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            // 類別網格
            document.getElementById('categoryGrid').innerHTML = state.categories.map(c => {
                const spent = state.records.filter(r => r.category === c.name && r.date.startsWith(currentMonth) && r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
                const p = c.budget > 0 ? Math.min((spent / c.budget) * 100, 100) : 0;
                const isOver = c.budget > 0 && spent > c.budget;
                return `
                    <div onclick="openAnalysis('${c.name}')" class="bg-slate-50 p-3 rounded-2xl border border-slate-100 relative cursor-pointer hover:bg-white transition-all">
                        <button onclick="event.stopPropagation(); deleteCategory('${c.name}')" class="absolute top-1 right-2 text-slate-300 hover:text-red-500 text-xs">×</button>
                        <p class="text-[10px] font-bold text-slate-400 truncate pr-4">${c.name}</p>
                        <p class="text-sm font-black ${isOver?'text-red-500':'text-slate-800'}">$${spent}<span class="text-[9px] font-normal text-slate-400 ml-1">/ ${c.budget||'∞'}</span></p>
                        <div class="w-full bg-slate-200 h-1 rounded-full mt-2 overflow-hidden"><div class="h-full ${isOver?'bg-red-500':'bg-indigo-500'}" style="width: ${p}%"></div></div>
                    </div>
                `;
            }).join('');

            document.getElementById('activeCategory').innerHTML = state.categories.map(c => `<option>${c.name}</option>`).join('');
            let inc = 0, ex = 0;
            state.records.forEach(r => { if(r.type === 'income') inc += r.amount; else ex += r.amount; });
            document.getElementById('mainBalance').innerText = `$ ${state.budget + inc - ex}`;
            document.getElementById('budgetLimit').value = state.budget;
            document.getElementById('itemList').innerHTML = state.records.slice(-8).reverse().map(r => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                    <div><p class="text-sm font-bold text-slate-700">${r.itemName}</p><p class="text-[10px] text-slate-400">${r.category} · ${r.payment}</p></div>
                    <p class="font-black ${r.type==='income'?'text-green-600':'text-slate-900'}">${r.type==='income'?'+':'-'}$${r.amount}</p>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
